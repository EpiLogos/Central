name: OI97 compose authored ground with Living Wiki

on:
  push:
    branches: [converge/oi97-authored-ground-governance]
    paths:
      - '.github/workflows/oi97-compose-living-wiki.yml'

permissions:
  contents: write

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: converge/oi97-authored-ground-governance
      - name: Compose current ProjectCentral extensions and repair catalogue proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('ctrl/src/lib.rs')
          s = lib.read_text()
          if 'pub mod agent_governance;' not in s:
              s = s.replace('pub mod action;\n', 'pub mod action;\npub mod agent_governance;\n', 1)
          if 'pub mod projectcentral_ground;' not in s:
              s = s.replace('pub mod projectcentral;\n', 'pub mod projectcentral;\npub mod projectcentral_ground;\n', 1)
          anchor = '        super::projectcentral_ops_base::register_projectcentral_actions(registry);\n        super::projectcentral_now::register_projectcentral_now_actions(registry);'
          if 'super::projectcentral_ground::register_projectcentral_ground_actions(registry);' not in s:
              assert anchor in s
              s = s.replace(anchor, '        super::projectcentral_ops_base::register_projectcentral_actions(registry);\n        super::projectcentral_ground::register_projectcentral_ground_actions(registry);\n        super::projectcentral_now::register_projectcentral_now_actions(registry);', 1)
          if 'pub use agent_governance::{' not in s:
              anchor = 'pub use action::{\n    create_core_action_registry, ActionAvailability, ActionDescriptor, ActionExecutionContext,\n    ActionInputDefinition, ActionInputSelection, ActionOutputDefinition, ActionRegistry,\n    MutationClass,\n};\n'
              assert anchor in s
              block = '''pub use agent_governance::{
    apply_project_governance_relation, inspect_project_governance, inspect_root_governance,
    plan_project_governance, GovernanceApplyResult, GovernanceCandidate,
    GovernanceCompositionBoundary, GovernanceMaintenancePolicy, GovernancePlanItem,
    GovernanceProvenance, GovernanceSkippedSource, GovernanceSourceRecord,
    GovernanceSourceRelation, GovernanceTreatment, ProjectGovernanceInspection,
    ProjectGovernancePlan, RootGovernanceInspection, GOVERNANCE_RELATIONS_SCHEMA,
    GOVERNANCE_RELATIONS_SOURCE,
};
'''
              s = s.replace(anchor, anchor + block, 1)
          if 'pub use projectcentral_ground::{' not in s:
              anchor = '''pub use projectcentral::{
    projectcentral_paths, read_project_manifest, ManifestValidation, ProjectCentralManifest,
    ProjectCentralPaths, WikiBinding, AGENT_DIR, AGENT_GOVERNANCE_DIR, HUMAN_SOURCE_DIR,
    PROJECTCENTRAL_DIR, PROJECT_MANIFEST, PROJECT_SCHEMA, ROOT_AGENT_DIR,
    ROOT_AGENT_GOVERNANCE_DIR, ROOT_HUMAN_SOURCE_DIR, ROOT_WIKI_DIR, ROOT_WIKI_SOURCE,
    WIKI_DIR, WIKI_PROFILE, WIKI_SOURCE,
};
'''
              assert anchor in s
              block = '''pub use projectcentral_ground::{
    apply_accepted_ground_relation, inspect_project_ground, plan_project_ground,
    register_projectcentral_ground_actions, GroundAccountHandoff, GroundApplyResult,
    GroundCandidate, GroundInspection, GroundPlan, GroundPlanItem, GroundReturnPolicy,
    GroundSkippedSource, GroundSourceRecord, GroundSourceRelation, GroundStatus,
    SourceProvenance, SourceStanding, SourceTreatment, GROUND_RELATIONS_DIR,
    GROUND_RELATIONS_SCHEMA, GROUND_RELATIONS_SOURCE,
};
'''
              s = s.replace(anchor, anchor + block, 1)
          old = '    GROUND_RELATIONS_SCHEMA, GROUND_RELATIONS_SOURCE, PROJECT_HORIZON_STATE,\n'
          new = '    GROUND_RELATIONS_SCHEMA as SOURCE_HORIZON_GROUND_RELATIONS_SCHEMA,\n    GROUND_RELATIONS_SOURCE as SOURCE_HORIZON_GROUND_RELATIONS_SOURCE, PROJECT_HORIZON_STATE,\n'
          assert old in s or new in s
          s = s.replace(old, new, 1)
          lib.write_text(s)

          f = Path('ctrl/tests/foundation.rs')
          s = f.read_text()
          s = s.replace('assert_eq!(actions.len(), 34);', 'assert_eq!(actions.len(), 37);')
          human_anchor = '    assert!(human.output.contains("projectcentral.ground.apply\\tApply accepted Project ground relation"));\n'
          if 'projectcentral.change.horizon\\tRead current Source Change Horizon' not in s:
              assert human_anchor in s
              s = s.replace(human_anchor, human_anchor + '    assert!(human.output.contains("projectcentral.change.horizon\\tRead current Source Change Horizon"));\n    assert!(human.output.contains("projectcentral.change.reconcile\\tReconcile Project source revisions"));\n    assert!(human.output.contains("projectcentral.change.ack\\tAcknowledge Source Change cursor"));\n', 1)
          ids_anchor = '        "projectcentral.ground.apply",\n'
          if '        "projectcentral.change.horizon",\n' not in s:
              assert ids_anchor in s
              s = s.replace(ids_anchor, ids_anchor + '        "projectcentral.change.horizon",\n        "projectcentral.change.reconcile",\n        "projectcentral.change.ack",\n', 1)
          f.write_text(s)

          cli = Path('docs/CLI-REFERENCE.md')
          s = cli.read_text()
          s = s.replace('The current composed registry exposes 34 Actions:', 'The current composed registry exposes 37 Actions:')
          row = '| `projectcentral.ground.apply` | record an explicitly human-accepted source-ground relation | `action run projectcentral.ground.apply` |\n'
          if '| `projectcentral.change.horizon` |' not in s:
              assert row in s
              s = s.replace(row, row + '| `projectcentral.change.horizon` | reconcile participating Project sources and read the deterministic Source Change Horizon | `action run projectcentral.change.horizon` |\n| `projectcentral.change.reconcile` | reconcile authoritative Project source revisions | `action run projectcentral.change.reconcile` |\n| `projectcentral.change.ack` | advance one named consumer cursor without changing source | `action run projectcentral.change.ack` |\n', 1)
          cli.write_text(s)
          PY
          cargo test --workspace --locked
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ctrl/src/lib.rs ctrl/tests/foundation.rs docs/CLI-REFERENCE.md
          git rm .github/workflows/oi97-compose-living-wiki.yml
          git commit -m 'fix(oi97): compose authored ground with Source Change Horizon'
          git push origin HEAD:converge/oi97-authored-ground-governance
