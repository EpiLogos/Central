name: BKMR workbench
on:
  push:
    branches: [agent/bkmr-154-persistent]
    paths: [.github/workflows/bkmr-workbench.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: 65d5b886e471530dd9e8a93b12644fb8fb2ab7b9
          path: ai-kit
      - name: Archive exact current source
        run: tar --exclude=.git -czf aikit-current.tar.gz ai-kit
      - uses: actions/upload-artifact@v4
        with:
          name: bkmr-aikit-current
          path: aikit-current.tar.gz
          retention-days: 1
