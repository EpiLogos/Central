name: BKMR workbench
on:
  push:
    branches: [agent/bkmr-154-persistent]
    paths: [.github/workflows/bkmr-workbench.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: Central
      - uses: actions/checkout@v4
        with:
          repository: EpiLogos/ai-kit
          ref: 1f9ef6ab2ab45cf79732426c171e5de13273d197
          path: ai-kit
      - name: Archive source workspace
        run: tar --exclude=.git -czf sources.tar.gz Central ai-kit
      - uses: actions/upload-artifact@v4
        with:
          name: bkmr-source-workspace
          path: sources.tar.gz
          retention-days: 1
      - name: Prepare offline compiler and dependencies
        run: |
          cd Central && cargo fetch --locked && cd ../ai-kit && cargo fetch --locked && cd ..
          mkdir toolchain
          cp -a "$(rustc --print sysroot)/bin" toolchain/
          cp -a "$(rustc --print sysroot)/lib" toolchain/
          rm -rf toolchain/lib/rustlib/src
          tar -czf offline-rust.tar.gz toolchain -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        with:
          name: bkmr-offline-rust
          path: offline-rust.tar.gz
          retention-days: 1
