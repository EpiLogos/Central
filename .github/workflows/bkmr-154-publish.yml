name: Publish Central BKMR checkpoint
on:
  push:
    branches: [agent/bkmr-154-persistent]
    paths: [.github/workflows/bkmr-154-publish.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bkmr-154-persistent
      - name: Verify exact source patch and publish
        shell: python
        run: |
          import pathlib,base64,lzma,hashlib,subprocess
          hashes=['36703726ff32c035239d7bf104044842ee9bfc20610f338992b75541ad50cde0','0546dca4d72dfe54fdbce9816e07b3ec37465d04fd58c995160ea26c3d6abbf0','e0cce28659eb0d84b690e1aa972d5c06847941e1c00b0122505a3a617daf5ff6','6dd8c74f237372ad2e104ba70258aca61a43005d85797f21e3a5f9965db9d382']
          parts=[]
          for index,expected in enumerate(hashes):
              text=pathlib.Path(f'.github/bkmr-154-transfer.{index}').read_text().strip()
              assert hashlib.sha256(text.encode()).hexdigest()==expected, f'Checkpoint part {index} differs'
              parts.append(text)
          patch=lzma.decompress(base64.b64decode(''.join(parts)))
          assert hashlib.sha256(patch).hexdigest()=='0806844e069ea61bb0353438c23ec3562b03d2930014864590a08044eba2594f'
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          paths=[str(p) for p in pathlib.Path('.github').glob('bkmr-154-transfer.*')]
          paths+=['.github/workflows/bkmr-154-publish.yml','.github/workflows/bkmr-workbench.yml','.github/workflows/bkmr-native-transfer.yml']
          subprocess.run(['git','rm','--',*paths],check=True)
          subprocess.run(['git','config','user.name','Epii'],check=True)
          subprocess.run(['git','config','user.email','noreply@github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(bkmr): persistent scoped maps, managed links and recoverable source moves'],check=True)
          subprocess.run(['git','push','origin','HEAD:agent/bkmr-154-persistent'],check=True)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: central-bkmr-transfer-diagnostic
          path: .github/bkmr-154-transfer.*
          include-hidden-files: true
          retention-days: 1
