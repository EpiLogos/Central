name: W2 original form stdin transport
on:
  push:
    branches: [agent/w2-central-root-day-document-20260920]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  native:
    if: github.ref == 'refs/heads/agent/w2-central-root-day-document-20260920'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Publish exact bounded native transport
        run: |
          python3 .github/w2-stdin-apply.py
          rustfmt --edition 2021 ctrl/src/cli.rs ctrl/tests/action_stdin.rs
          git diff --check
          git add ctrl/src/cli.rs ctrl/tests/action_stdin.rs
          git rm .github/w2-stdin-apply.py .github/workflows/w2-stdin-apply.yml
          git -c user.name='EpiLogos W2' -c user.email='186434782+EpiLogos@users.noreply.github.com' commit -m 'fix(central): stream bounded original source payloads through native action stdin'
          git push origin HEAD:refs/heads/agent/w2-central-root-day-document-20260920
          mkdir -p "$RUNNER_TEMP/w2-stdin"
          git rev-parse HEAD > "$RUNNER_TEMP/w2-stdin/source-revision.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/w2-stdin/source.tar.gz"
      - name: Large payload and refusal regressions
        run: cargo test --locked -p ctrl --test action_stdin --test root_source_day -- --nocapture 2>&1 | tee "$RUNNER_TEMP/w2-stdin/tests.log"
      - name: Full native workspace
        if: always()
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/w2-stdin/workspace.log"
      - name: Compile paired native consumer
        if: always()
        run: |
          cargo build --locked -p ctrl
          cp target/debug/ctrl "$RUNNER_TEMP/w2-stdin/ctrl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-stdin-native
          path: ${{ runner.temp }}/w2-stdin
          retention-days: 7
