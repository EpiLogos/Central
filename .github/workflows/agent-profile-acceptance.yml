name: Agent profile acceptance
on:
  push:
    branches: [agent/accepted-agent-definitions-20260920]
  pull_request:
    paths: ['ctrl/src/agent_profile*', 'ctrl/tests/agent_profile*', '.github/workflows/agent-profile-acceptance.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Record exact source; this workflow never edits or commits
        run: |
          mkdir -p acceptance-evidence
          git rev-parse HEAD > acceptance-evidence/source-revision.txt
          git diff --exit-code
          git archive --format=tar.gz HEAD > acceptance-evidence/source.tar.gz
      - name: Production acceptance and CLI tests
        id: focused
        continue-on-error: true
        shell: bash
        run: cargo test --locked -p ctrl --test agent_profile_acceptance -- --nocapture 2>&1 | tee acceptance-evidence/focused.log
      - name: Full native repository tests
        id: all
        continue-on-error: true
        shell: bash
        run: cargo test --workspace --all-targets --locked 2>&1 | tee acceptance-evidence/workspace.log
      - name: Full repository formatting check
        id: fmt
        continue-on-error: true
        shell: bash
        run: cargo fmt --all --check 2>&1 | tee acceptance-evidence/fmt.log
      - name: Full strict lint; baseline failures remain failures
        id: lint
        continue-on-error: true
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee acceptance-evidence/clippy.log
      - name: Build native CLI
        id: build
        continue-on-error: true
        shell: bash
        run: cargo build --locked -p ctrl --bin ctrl 2>&1 | tee acceptance-evidence/build.log
      - name: Verify tests did not edit source
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-profile-acceptance-evidence
          path: acceptance-evidence/
          retention-days: 7
      - name: Retain every failed gate
        if: steps.focused.outcome != 'success' || steps.all.outcome != 'success' || steps.fmt.outcome != 'success' || steps.lint.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
