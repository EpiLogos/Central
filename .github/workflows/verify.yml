name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  git-sync-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Public Synchronizer conformance and real Git target acceptance
        run: cargo test -p central-git-sync-connector
      - name: Core does not depend on the proving Connector
        shell: bash
        run: |
          cargo tree -p ctrl --edges normal > "$RUNNER_TEMP/ctrl-tree.txt"
          cat "$RUNNER_TEMP/ctrl-tree.txt"
          if grep -q 'central-git-sync-connector' "$RUNNER_TEMP/ctrl-tree.txt"; then
            echo "fresh-session proving Connector leaked into ctrl core dependencies"
            exit 1
          fi
