name: Publish verified BKMR owner
on:
  push:
    branches: [agent/bkmr-154-persistent]
    paths: [.github/workflows/bkmr-publish.yml]
  pull_request:
    paths: [.github/workflows/bkmr-publish.yml]
permissions:
  contents: read
jobs:
  packet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: bkmr-owner-packet
          path: .bkmr-publish/
          include-hidden-files: true
          retention-days: 1
  publish:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish checksum and tree verified code
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, os
          encoded = ''.join(pathlib.Path(f'.bkmr-publish/part{i}').read_text().strip() for i in range(4))
          patch = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '2d8ee13d1e84c0de9be4cf188a3f067664bbfbe31f866731d411739009baad03'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'bkmr.patch').write_bytes(patch)
          PY
          git config user.name 'Epii'
          git config user.email 'frank.g.taylor97@gmail.com'
          git checkout --detach 8d0c4fe41e68f6149aac7a36ea5c60d94afc67db
          test "$(git write-tree)" = '72989b7e6b3fd090b704dca158d1cd99471bcc6d'
          git apply --index --whitespace=error "$RUNNER_TEMP/bkmr.patch"
          test "$(git write-tree)" = '91f0251c76db25c35c7af00b320bdd153ed4e3ae'
          git restore --source="$GITHUB_SHA" --staged --worktree -- .github
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'feat(bkmr): consolidate verified owner and 41 native joined regressions' | git commit-tree "$tree" -p "$GITHUB_SHA" -p 8d0c4fe41e68f6149aac7a36ea5c60d94afc67db)
          git push origin "$commit:refs/heads/agent/bkmr-154-persistent"
          echo "PUBLISHED_COMMIT=$commit"
          echo 'VERIFIED_CODE_TREE=91f0251c76db25c35c7af00b320bdd153ed4e3ae'
