name: BKMR native transfer
on:
  push:
    branches: [agent/bkmr-154-persistent]
    paths: [.github/workflows/bkmr-native-transfer.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Package official CLI and its dynamic runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/bkmr-env"
          "$RUNNER_TEMP/bkmr-env/bin/pip" install bkmr==7.6.7
          mkdir native native/lib
          find "$RUNNER_TEMP/bkmr-env" -type f -name bkmr -exec file {} \;
          BIN=$(find "$RUNNER_TEMP/bkmr-env" -type f -name bkmr -exec sh -c 'file "$1" | grep -q ELF && echo "$1"' _ {} \; | head -1)
          test -n "$BIN"
          cp "$BIN" native/bkmr-bin
          ldd "$BIN"
          ldd "$BIN" | awk '/=> \/|^\s*\// { for(i=1;i<=NF;i++) if($i ~ /^\//) print $i }' | while read library; do cp -L "$library" native/lib/; done
          cp -L /lib64/ld-linux-x86-64.so.2 native/lib/
          tar -czf bkmr-native.tar.gz native
      - uses: actions/upload-artifact@v4
        with:
          name: bkmr-native-runtime
          path: bkmr-native.tar.gz
          retention-days: 1
