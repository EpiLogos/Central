name: Flow 93 hardening

on:
  push:
    branches:
      - feat/flow-source-93

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/apply-flow-93-hardening.py
      - name: Commit hardened Flow integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[FLOW] Preserve authority boundaries and public contract"
          git push origin HEAD:feat/flow-source-93
