name: W2 root source and Day proof
on:
  push:
    branches: [agent/w2-central-root-day-document-20260920]
permissions:
  contents: write
jobs:
  native:
    if: github.ref == 'refs/heads/agent/w2-central-root-day-document-20260920'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Retain original failing regressions before repair
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/w2-native"
          git rev-parse HEAD > "$RUNNER_TEMP/w2-native/before-revision.txt"
          cargo test --locked -p ctrl --test root_source_day -- --nocapture 2>&1 | tee "$RUNNER_TEMP/w2-native/original-regressions.log"
      - name: Apply exact-base scoped code and publish without merging
        run: |
          test "$GITHUB_REF" = refs/heads/agent/w2-central-root-day-document-20260920
          python3 .github/w2-root-day-apply.py
          rustfmt --edition 2021 ctrl/src/world_source.rs ctrl/src/source_horizon.rs ctrl/src/source_horizon_extensions.rs ctrl/src/continuous_work/temporal.rs ctrl/tests/root_source_day.rs
          git diff --check
          git add ctrl/src/world_source.rs ctrl/src/source_horizon.rs ctrl/src/source_horizon_extensions.rs ctrl/src/continuous_work/temporal.rs ctrl/tests/root_source_day.rs
          git rm .github/w2-root-day-apply.py .github/workflows/w2-root-day-apply.yml
          git -c user.name='EpiLogos W2' -c user.email='186434782+EpiLogos@users.noreply.github.com' commit -m 'fix(central): root source authority and exact native Day document resolution'
          git push origin HEAD:refs/heads/agent/w2-central-root-day-document-20260920
          git rev-parse HEAD | tee "$RUNNER_TEMP/w2-native/source-revision.txt"
          git archive HEAD | gzip > "$RUNNER_TEMP/w2-native/source.tar.gz"
      - name: Exact repaired regressions
        run: cargo test --locked -p ctrl --test root_source_day -- --nocapture 2>&1 | tee "$RUNNER_TEMP/w2-native/root-source-day.log"
      - name: Complete native workspace, retaining original failures
        if: always()
        run: cargo test --workspace --locked --no-fail-fast -- --nocapture 2>&1 | tee "$RUNNER_TEMP/w2-native/workspace.log"
      - name: Build native product for desktop consumer replay
        run: |
          cargo build --locked -p ctrl 2>&1 | tee "$RUNNER_TEMP/w2-native/build.log"
          cp target/debug/ctrl "$RUNNER_TEMP/w2-native/ctrl"
          sha256sum target/debug/ctrl > "$RUNNER_TEMP/w2-native/binary-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w2-native-source-proof
          path: ${{ runner.temp }}/w2-native
          retention-days: 7
