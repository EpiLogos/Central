name: Flow role hardening

on:
  push:
    branches:
      - feat/flow-source-93

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/flow-role-hardening.py
      - name: Commit hardened role composition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[FLOW] Compose Flow with existing source roles"
          git push origin HEAD:feat/flow-source-93
