[package]
name = "ctrl"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Explicit native qualification only. Default workspace/test/lint selection
# cannot build or invoke the physical inclusion-failure child.
native-receiving-incomplete-child = []
# Default-off native ordinary-file checkpoint qualification. The selected child
# links central_ctrl normally and alone arms its exact owned-root admission.
# The opted-in library contains the bridge; default builds contain no hooks.
native-ordinary-interruption-child = []
# The shipped ctrl cut composes the git-sync Connector (GitState,
# SourceHistory) so GitState-backed reads (central.git.census) work through
# the CLI on every platform, not only the desktop host surface: release and
# verify builds pass --features cli-git-sync explicitly. The core keeps the
# dependency optional and OFF by default — the default dependency tree never
# carries it (enforced by the verify workflow boundary guard).
cli-git-sync = ["dep:central-git-sync-connector"]

[lib]
name = "central_ctrl"
path = "src/lib.rs"

[[bin]]
name = "ctrl"
path = "src/main.rs"

[[test]]
name = "native_receiving_incomplete_child"
path = "tests/native_receiving_incomplete_child.rs"
harness = false
required-features = ["native-receiving-incomplete-child"]

[[test]]
name = "native_ordinary_interruption_child"
path = "tests/native_ordinary_interruption_child.rs"
harness = false
required-features = ["native-ordinary-interruption-child"]

[dependencies]
central-connector-sdk = { path = "../crates/connector-sdk" }
central-reference-connectors = { path = "../connectors/reference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
# Owner-side HTML5 sanitisation and civil-time policy, not browser/network services.
ammonia = "4.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
# git-sync backs the GitState/SourceHistory read models (central.git.census);
# composed by the shipped CLI via the cli-git-sync feature, optional for
# library embedders.
central-git-sync-connector = { path = "../connectors/git-sync", optional = true }

[dev-dependencies]
# Contract tests validate emitted documents against the frozen C0 JSON Schemas
# (byte-exact fixture copies); default features stay off (no external resolver).
jsonschema = { version = "0.56.0", default-features = false }
