[package]
name = "ctrl"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "central_ctrl"
path = "src/lib.rs"

[[bin]]
name = "ctrl"
path = "src/main.rs"

[dependencies]
central-connector-sdk = { path = "../crates/connector-sdk" }
central-reference-connectors = { path = "../connectors/reference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
