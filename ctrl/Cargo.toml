[package]
name = "ctrl"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "central_ctrl"
path = "src/lib.rs"

[[bin]]
name = "ctrl"
path = "src/main.rs"

[dependencies]
central-connector-sdk = { path = "../crates/connector-sdk" }
central-reference-connectors = { path = "../connectors/reference" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"
# Owner-side HTML5 sanitisation and civil-time policy, not browser/network services.
ammonia = "4.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
