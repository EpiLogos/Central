[package]
name = "central-ctrl"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "central_ctrl"
path = "ctrl/src/lib.rs"

[[bin]]
name = "ctrl"
path = "ctrl/src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.12"
